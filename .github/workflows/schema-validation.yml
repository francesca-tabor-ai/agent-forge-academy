name: Schema Validation

on:
  push:
    branches: [main, develop]
    paths:
      - 'supabase/migrations/**'
      - 'app/api/**'
      - 'lib/**'
  pull_request:
    branches: [main, develop]
    paths:
      - 'supabase/migrations/**'
      - 'app/api/**'
      - 'lib/**'
  workflow_dispatch:

jobs:
  validate-schema:
    name: Validate Database Schema
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate schema
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run validate:schema

      - name: Health check endpoint test
        if: always()
        run: |
          echo "Testing schema health check endpoint..."
          # This would require a running instance, so we'll skip in CI
          # In production, you'd call: curl http://your-app/api/health/schema
          echo "Schema validation script completed"
